name: CI offline
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Python and JavaScript offline
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: 'false'
      TZ: America/Sao_Paulo
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # Preservation tests read historical checkpoints with git show.
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.14.0'
      - name: Whitespace and conflict markers
        run: git diff --check HEAD^ HEAD
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements-ci.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Reject local credentials
        run: test ! -f .streamlit/secrets.toml
      - name: Full Python suite with network blocked
        run: python -m pytest -p ci.offline -q
      - name: JavaScript links and special characters
        run: |
          node --input-type=module -e "import {result} from './tests/carteira_deep_link.mjs'; import {specialNamesResult} from './tests/carteira_frontend.mjs'; console.log({links: result, specialNames: specialNamesResult});"
